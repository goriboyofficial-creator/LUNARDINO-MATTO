<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Lunardino Loot</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#game {
    width:100vw;
    height:100vh;
    background:linear-gradient(#333,#111);
    position:relative;
}

.locker {
    position:absolute;
    width:70px;
    height:120px;
    background:#777;
    border:4px solid #333;
    cursor:pointer;
}

.locker:hover {
    background:#aaa;
}

#loot {
    display:none;
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    background:black;
    border:2px solid white;
    padding:30px;
    font-size:30px;
}

#avanti {
    position:absolute;
    bottom:30px;
    right:30px;
    padding:20px 40px;
    font-size:20px;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="loot">LOOT</div>

<button id="avanti">AVANTI</button>


<script>

let passo=0;
let game=document.getElementById("game");
let loot=document.getElementById("loot");


function creaArmadietti(){

game.innerHTML="";

for(let i=0;i<6;i++){

let sinistra=document.createElement("div");
sinistra.className="locker";

sinistra.style.left="15%";
sinistra.style.top=(100+i*100)+"px";

sinistra.onclick=function(){
loot.style.display="block";
loot.innerHTML="LOOT";
}

game.appendChild(sinistra);



let destra=document.createElement("div");
destra.className="locker";

destra.style.right="15%";
destra.style.top=(100+i*100)+"px";

destra.onclick=function(){
loot.style.display="block";
loot.innerHTML="LOOT";
}

game.appendChild(destra);

}

}


document.getElementById("avanti").onclick=function(){

passo++;

creaArmadietti();

}



creaArmadietti();

</script>

</body>
</html>
