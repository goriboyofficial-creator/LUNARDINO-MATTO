<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Lunardino Loot</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

/* SCENA */
#game {
    perspective: 900px;
    width:100vw;
    height:100vh;
    position:relative;
}

/* CORRIDOIO */
#corridor {
    position:absolute;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform 0.6s ease;
}

/* PAVIMENTO */
.floor {
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(#555,#111);
    transform: rotateX(75deg) translateZ(-300px);
}

/* PARETI */
.wall {
    position:absolute;
    width:50%;
    height:100%;
    background:linear-gradient(#333,#111);
}

.left {
    left:0;
    transform: rotateY(25deg);
}

.right {
    right:0;
    transform: rotateY(-25deg);
}

/* LUCI */
.light {
    position:absolute;
    width:80px;
    height:10px;
    background:white;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 20px white;
}

/* ARMADIETTI */
.locker {
    position:absolute;
    width:70px;
    height:130px;
    border:2px solid #111;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

.locker:hover {
    transform:scale(1.1);
}

/* MANIGLIA */
.handle {
    position:absolute;
    width:10px;
    height:10px;
    background:black;
    right:5px;
    top:50%;
}

/* LOOT POPUP */
#loot {
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:black;
    color:white;
    padding:40px;
    font-size:30px;
    border:2px solid white;
    text-align:center;
}

/* BOTTONE */
#avanti {
    position:absolute;
    bottom:30px;
    right:30px;
    padding:20px 40px;
    font-size:20px;
    cursor:pointer;
    background:white;
    border:none;
}
</style>
</head>

<body>

<div id="game">
    <div id="corridor">
        <div class="floor"></div>
        <div class="wall left"></div>
        <div class="wall right"></div>

        <div class="light"></div>
    </div>
</div>

<div id="loot"></div>
<button id="avanti">AVANTI</button>
