<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corridoio Infinito</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; background: rgba(0,0,0,0.85);
    z-index: 100; text-align: center; cursor: pointer; padding: 20px; box-sizing: border-box;
  }
  #overlay h1 { margin-bottom: 10px; }
  #overlay p { margin: 4px 0; opacity: 0.85; }
  #startBtn {
    margin-top: 20px; padding: 14px 34px; font-size: 18px; font-weight: bold;
    background: #2980b9; color: #fff; border: none; border-radius: 6px; cursor: pointer;
  }
  #startBtn:hover { background: #3498db; }
  #errorBox {
    margin-top: 20px; color: #ff6b6b; font-size: 13px; max-width: 500px; white-space: pre-wrap;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;
    opacity: 0.7; pointer-events: none; z-index: 5; display: none;
  }
  #hud {
    position: absolute; bottom: 10px; left: 10px; color: #fff;
    font-size: 13px; opacity: 0.6; z-index: 5; pointer-events: none;
  }
  #interactPrompt {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.55); padding: 7px 16px; border-radius: 6px;
    font-size: 14px; display: none; z-index: 6; pointer-events: none; font-weight: bold;
  }
  #foundPopup {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(20,20,20,0.9); padding: 12px 24px; border-radius: 8px;
    font-size: 17px; font-weight: bold; opacity: 0; transition: opacity 0.4s ease;
    z-index: 6; pointer-events: none; border: 1px solid rgba(255,255,255,0.2); text-align: center;
  }
  #foundPopup.visible { opacity: 1; }
</style>
</head>
<body>

<div id="overlay">
  <h1>Corridoio Infinito</h1>
  <p>WASD / frecce per muoverti — Mouse per guardarti intorno — Q/E per girarti</p>
  <p>F per aprire gli armadietti — ESC per uscire</p>
  <button id="startBtn" type="button">CLICCA QUI PER INIZIARE</button>
  <div id="errorBox"></div>
</div>
<div id="crosshair"></div>
<div id="hud">Distanza percorsa: <span id="dist">0</span> m</div>
<div id="interactPrompt">Premi F per aprire l'armadietto</div>
<div id="foundPopup"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  "use strict";

  const overlay = document.getElementById("overlay");
  const errorBox = document.getElementById("errorBox");
  const startBtn = document.getElementById("startBtn");
  const crosshair = document.getElementById("crosshair");
  const distEl = document.getElementById("dist");
  const interactPrompt = document.getElementById("interactPrompt");
  const foundPopup = document.getElementById("foundPopup");

  function showError(msg) {
    errorBox.textContent = "Problema rilevato: " + msg;
    console.error(msg);
  }

  window.addEventListener("error", (e) => {
    showError(e.message || "errore sconosciuto durante il caricamento.");
  });

  if (typeof THREE === "undefined") {
    showError("La libreria 3D (Three.js) non si è caricata. Controlla la connessione a internet, o che nessun blocco script/adblock stia impedendo il caricamento da cdnjs.cloudflare.com.");
    return;
  }

  function hasWebGL() {
    try {
      const canvas = document.createElement("canvas");
      return !!(window.WebGLRenderingContext &&
        (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));
    } catch (e) {
      return false;
    }
  }
  if (!hasWebGL()) {
    showError("Questo browser/dispositivo non supporta WebGL, necessario per la grafica 3D. Prova con un browser aggiornato (Chrome, Edge, Firefox) su un altro dispositivo.");
    return;
  }

  let scene, camera, renderer;
  let started = false;
  let pointerLocked = false;

  try {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    scene.fog = new THREE.Fog(0x05060a, 5, 45);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.7, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
  } catch (e) {
    showError("Impossibile inizializzare il renderer 3D: " + e.message);
    return;
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  scene.add(new THREE.AmbientLight(0x404050, 0.6));

  const CORRIDOR_WIDTH = 6;
  const CORRIDOR_HEIGHT = 4;
  const SEGMENT_LENGTH = 10;
  const SEGMENTS_AHEAD = 6;
  const SEGMENTS_BEHIND = 2;

  const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.9 });
  const ceilMat  = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 1.0 });
  const wallMat  = new THREE.MeshStandardMaterial({ color: 0x3a3a42, roughness: 0.8 });

  const lockerColors = [0xc0392b, 0x2980b9, 0x27ae60, 0xf39c12, 0x8e44ad, 0x16a085, 0xd35400, 0x7f8c8d, 0xe74c3c, 0x2c3e50];

  const segments = [];
  const interactables = [];
  let currentTarget = null;

  function createRandomItem() {
    const pool = [
      () => {
        const g = new THREE.Group();
        const can = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.6, roughness: 0.3 }));
        const band = new THREE.Mesh(new THREE.CylinderGeometry(0.047, 0.047, 0.03, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.5 }));
        band.position.y = 0.02;
        g.add(can, band);
        return { mesh: g, name: "una lattina di Coca-Cola" };
      },
      () => {
        const g = new THREE.Group();
        const lensMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.6 });
        const lensL = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.008, 8, 16), lensMat);
        lensL.position.x = -0.045;
        const lensR = lensL.clone();
        lensR.position.x = 0.045;
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.006), lensMat);
        g.add(lensL, lensR, bridge);
        return { mesh: g, name: "un paio di occhiali" };
      },
      () => {
        const g = new THREE.Group();
        for (let i = 0; i < 5; i++) {
          const bill = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.008, 0.06), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.7 }));
          bill.position.y = i * 0.01;
          bill.rotation.y = (Math.random() - 0.5) * 0.3;
          g.add(bill);
        }
        return { mesh: g, name: "un fascio di banconote" };
      },
      () => {
        const g = new THREE.Group();
        const book = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.03, 0.1), new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.8 }));
        g.add(book);
        return { mesh: g, name: "un vecchio libro" };
      },
      () => {
        const g = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.9, roughness: 0.2 });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.004, 8, 16), metalMat);
        const key = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.05, 0.01), metalMat);
        key.position.y = -0.03;
        g.add(ring, key);
        return { mesh: g, name: "un mazzo di chiavi" };
      },
      () => {
        const g = new THREE.Group();
        const phone = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.008), new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.4, metalness: 0.4 }));
        const screen = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.002), new THREE.MeshStandardMaterial({ color: 0x3399ff, emissive: 0x2266aa, emissiveIntensity: 0.4 }));
        screen.position.z = 0.006;
        g.add(phone, screen);
        return { mesh: g, name: "un vecchio cellulare" };
      },
      () => {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.14, 12), new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.7, roughness: 0.3 }));
        const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.02, 0.03, 12), new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0xffcc55, emissiveIntensity: 0.5 }));
        tip.position.y = 0.085;
        g.add(body, tip);
        return { mesh: g, name: "una torcia" };
      },
      () => {
        const g = new THREE.Group();
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
        const face = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.01, 16), metalMat);
        face.rotation.x = Math.PI / 2;
        const strapMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const strap = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.09, 0.005), strapMat);
        g.add(face, strap);
        return { mesh: g, name: "un orologio da polso" };
      },
      () => null
    ];
    const pick = pool[Math.floor(Math.random() * pool.length)];
    return pick();
  }

  function showPopup(text) {
    foundPopup.textContent = text;
    foundPopup.classList.add("visible");
    clearTimeout(showPopup._t);
    showPopup._t = setTimeout(() => foundPopup.classList.remove("visible"), 3000);
  }

  function openLocker(entry) {
    const data = entry.data;
    if (data.opened) return;
    data.opened = true;
    data.opening = true;

    const found = createRandomItem();
    if (found) {
      found.mesh.position.set(0.16, data.h * 0.5, 0);
      data.group.add(found.mesh);
      showPopup("Hai trovato: " + found.name + "!");
    } else {
      showPopup("L'armadietto è vuoto...");
    }
  }

  function createInteractiveLocker(sideSign) {
    const w = 0.6 + Math.random() * 0.6;
    const h = 1.4 + Math.random() * 1.1;
    const d = 0.4 + Math.random() * 0.4;
    const color = lockerColors[Math.floor(Math.random() * lockerColors.length)];

    const group = new THREE.Group();

    const back = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, h, w),
      new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.9 })
    );
    back.position.set(0.025, h / 2, 0);
    group.add(back);

    const hinge = new THREE.Group();
    hinge.position.set(d, 0, -w / 2);
    group.add(hinge);

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, h * 0.95, w * 0.95),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.3 })
    );
    door.position.set(0, h / 2, (w * 0.95) / 2);
    door.castShadow = true;
    hinge.add(door);

    const handle = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.04, 0.15),
      new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 })
    );
    handle.position.set(0.035, 0, (w * 0.95) / 2 - 0.12);
    door.add(handle);

    const hitZone = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hitZone.rotation.y = Math.PI / 2;
    hitZone.position.set(d, h / 2, 0);
    group.add(hitZone);

    const wallX = sideSign * (CORRIDOR_WIDTH / 2);
    group.position.x = wallX;
    if (sideSign > 0) group.rotation.y = Math.PI;

    const data = { opened: false, opening: false, animProgress: 0, hinge, group, h };
    const entry = { mesh: hitZone, data };
    return { group, entry };
  }

  function buildSegment(index) {
    const group = new THREE.Group();
    const zStart = -index * SEGMENT_LENGTH;
    group.position.z = zStart;
    const entries = [];

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(CORRIDOR_WIDTH, SEGMENT_LENGTH), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -SEGMENT_LENGTH / 2);
    floor.receiveShadow = true;
    group.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(CORRIDOR_WIDTH, SEGMENT_LENGTH), ceilMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, CORRIDOR_HEIGHT, -SEGMENT_LENGTH / 2);
    group.add(ceiling);

    const wallL = new THREE.Mesh(new THREE.PlaneGeometry(SEGMENT_LENGTH, CORRIDOR_HEIGHT), wallMat);
    wallL.rotation.y = Math.PI / 2;
    wallL.position.set(-CORRIDOR_WIDTH / 2, CORRIDOR_HEIGHT / 2, -SEGMENT_LENGTH / 2);
    group.add(wallL);

    const wallR = new THREE.Mesh(new THREE.PlaneGeometry(SEGMENT_LENGTH, CORRIDOR_HEIGHT), wallMat);
    wallR.rotation.y = -Math.PI / 2;
    wallR.position.set(CORRIDOR_WIDTH / 2, CORRIDOR_HEIGHT / 2, -SEGMENT_LENGTH / 2);
    group.add(wallR);

    const light = new THREE.PointLight(0xfff2cc, 1.4, 12, 2);
    light.position.set(0, CORRIDOR_HEIGHT - 0.3, -SEGMENT_LENGTH / 2);
    group.add(light);

    const fixture = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.1, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffcc, emissiveIntensity: 0.8 })
    );
    fixture.position.set(0, CORRIDOR_HEIGHT - 0.05, -SEGMENT_LENGTH / 2);
    group.add(fixture);

    const lockersPerSide = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < lockersPerSide; i++) {
      const zPos = -(i + 0.5) * (SEGMENT_LENGTH / lockersPerSide) + (Math.random() * 0.6 - 0.3);

      const leftBuilt = createInteractiveLocker(-1);
      leftBuilt.group.position.z = zPos;
      group.add(leftBuilt.group);
      entries.push(leftBuilt.entry);

      const rightBuilt = createInteractiveLocker(1);
      rightBuilt.group.position.z = zPos;
      group.add(rightBuilt.group);
      entries.push(rightBuilt.entry);
    }

    scene.add(group);
    return { group, index, entries };
  }

  function ensureSegments(playerIndex) {
    const maxIndex = playerIndex + SEGMENTS_AHEAD;
    while (segments.length === 0 || segments[segments.length - 1].index < maxIndex) {
      const nextIndex = segments.length === 0 ? 0 : segments[segments.length - 1].index + 1;
      const seg = buildSegment(nextIndex);
      segments.push(seg);
      for (const entry of seg.entries) interactables.push(entry);
    }
    while (segments.length > 0 && segments[0].index < playerIndex - SEGMENTS_BEHIND) {
      const old = segments.shift();
      for (const entry of old.entries) {
        const idx = interactables.indexOf(entry);
        if (idx !== -1) interactables.splice(idx, 1);
        if (currentTarget === entry) { currentTarget = null; interactPrompt.style.display = "none"; }
      }
      scene.remove(old.group);
      old.group.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      });
    }
  }

  ensureSegments(0);

  let yaw = 0, pitch = 0;
  const keys = {};

  function startGame() {
    if (started) return;
    started = true;
    overlay.style.display = "none";
    crosshair.style.display = "block";

    try {
      const el = renderer.domElement;
      if (el.requestPointerLock) {
        const req = el.requestPointerLock();
        if (req && typeof req.catch === "function") req.catch(() => {});
      }
    } catch (e) {}
  }

  startBtn.addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
  overlay.addEventListener("click", startGame);
  overlay.addEventListener("touchstart", startGame, { passive: true });

  document.addEventListener("pointerlockchange", () => {
    pointerLocked = document.pointerLockElement === renderer.domElement;
  });

  document.addEventListener("mousemove", (e) => {
    if (!started) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
  });

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Escape" && document.exitPointerLock) document.exitPointerLock();
    if (e.code === "KeyF" && started && currentTarget && !currentTarget.data.opened) {
      openLocker(currentTarget);
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  const clock = new THREE.Clock();
  const MOVE_SPEED = 4.2;
  const TURN_SPEED = 1.8;
  const BOUND = CORRIDOR_WIDTH / 2 - 0.6;
  const raycaster = new THREE.Raycaster();
  const centerNDC = new THREE.Vector2(0, 0);
  let traveled = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    if (started) {
      if (keys["KeyQ"]) yaw += TURN_SPEED * dt;
      if (keys["KeyE"]) yaw -= TURN_SPEED * dt;
    }

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    if (started) {
      const forward = new THREE.Vector3(Math.sin(-yaw), 0, -Math.cos(-yaw));
      const right = new THREE.Vector3(forward.z, 0, -forward.x);

      let moveX = 0, moveZ = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) moveZ += 1;
      if (keys["KeyS"] || keys["ArrowDown"]) moveZ -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;

      const dir = new THREE.Vector3();
      dir.addScaledVector(forward, moveZ);
      dir.addScaledVector(right, moveX);
      if (dir.lengthSq() > 0) {
        dir.normalize();
        camera.position.addScaledVector(dir, MOVE_SPEED * dt);
        traveled += MOVE_SPEED * dt;
      }

      camera.position.x = Math.max(-BOUND, Math.min(BOUND, camera.position.x));
      camera.position.y = 1.7;
    }

    for (const entry of interactables) {
      const d = entry.data;
      if (d.opening && d.animProgress < 1) {
        d.animProgress = Math.min(1, d.animProgress + dt / 0.5);
        const eased = 1 - Math.pow(1 - d.animProgress, 3);
        d.hinge.rotation.y = -eased * (Math.PI * 0.75);
      }
    }

    if (started) {
      raycaster.setFromCamera(centerNDC, camera);
      const meshList = interactables.map((e) => e.mesh);
      const hits = meshList.length ? raycaster.intersectObjects(meshList) : [];
      let found = null;
      for (const hit of hits) {
        if (hit.distance <= 2.8) {
          const entry = interactables.find((e) => e.mesh === hit.object);
          if (entry && !entry.data.opened) { found = entry; break; }
        }
      }
      currentTarget = found;
      interactPrompt.style.display = found ? "block" : "none";
    }

    const playerIndex = Math.floor(-camera.position.z / SEGMENT_LENGTH);
    ensureSegments(playerIndex);

    distEl.textContent = Math.floor(traveled);

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
