<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corridoio Loot</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial;
}

/* SFONDO CORRIDOIO */
.corridor {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(to bottom, #444 0%, #111 100%);
  overflow: hidden;
}

/* LINEE PROSPETTIVA */
.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 60%;
  background: linear-gradient(to top, #000, transparent);
}

/* LATO SINISTRO E DESTRO */
.side {
  position: absolute;
  top: 0;
  height: 100%;
  width: 30%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 25px;
}

.left {
  left: 0;
  transform: skewY(5deg);
}

.right {
  right: 0;
  transform: skewY(-5deg);
}

/* ARMADIETTI */
.locker {
  width: 140px;
  height: 200px;
  background: linear-gradient(#4da3ff, #1c4c7a);
  border-radius: 8px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  transition: 0.2s;
}

.locker:hover {
  transform: scale(1.1);
}

/* MANIGLIA */
.handle {
  width: 10px;
  height: 40px;
  background: #ddd;
  position: absolute;
  right: 10px;
  top: 80px;
  border-radius: 3px;
}

/* LOOT */
.loot {
  position: fixed;
  color: yellow;
  font-size: 26px;
  font-weight: bold;
  pointer-events: none;
  animation: fade 1s forwards;
}

@keyframes fade {
  0% {opacity:1; transform:translateY(0);}
  100% {opacity:0; transform:translateY(-60px);}
}

/* BOTTONE */
button {
  position: absolute;
  bottom: 20px;
  right: 20px;
  padding: 15px 30px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="corridor">
  <div class="floor"></div>

  <div class="side left" id="left"></div>
  <div class="side right" id="right"></div>
</div>

<button onclick="avanza()">AVANTI</button>

<script>
const left = document.getElementById("left");
const right = document.getElementById("right");

function creaLocker() {
  const locker = document.createElement("div");
  locker.className = "locker";

  const handle = document.createElement("div");
  handle.className = "handle";
  locker.appendChild(handle);

  locker.onclick = function(e) {
    const loot = document.createElement("div");
    loot.className = "loot";
    loot.innerText = "LOOT";

    loot.style.left = e.clientX + "px";
    loot.style.top = e.clientY + "px";

    document.body.appendChild(loot);
    setTimeout(() => loot.remove(), 1000);
  };

  return locker;
}

function riempi() {
  left.innerHTML = "";
  right.innerHTML = "";

  for (let i = 0; i < 4; i++) {
    left.appendChild(creaLocker());
    right.appendChild(creaLocker());
  }
}

function avanza() {
  document.querySelector(".corridor").style.transform = "translateY(-20px)";

  setTimeout(() => {
    document.querySelector(".corridor").style.transform = "translateY(0)";
    riempi();
  }, 200);
}

riempi();
</script>

</body>
</html>
