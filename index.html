<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corridoio Infinito</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; background: rgba(0,0,0,0.75);
    z-index: 10; text-align: center; cursor: pointer;
  }
  #overlay h1 { margin-bottom: 10px; }
  #overlay p { margin: 4px 0; opacity: 0.85; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: #fff; border-radius: 50%;
    opacity: 0.7; pointer-events: none; z-index: 5;
  }
  #hud {
    position: absolute; bottom: 10px; left: 10px; color: #fff;
    font-size: 13px; opacity: 0.6; z-index: 5; pointer-events: none;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>Corridoio Infinito</h1>
  <p>Clicca per iniziare</p>
  <p>WASD / frecce per muoverti — Mouse per guardarti intorno — ESC per uscire</p>
</div>
<div id="crosshair"></div>
<div id="hud">Distanza percorsa: <span id="dist">0</span> m</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
