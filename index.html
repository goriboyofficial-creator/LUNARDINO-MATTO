<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Corridoio Loot</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: Arial;
}

/* CORRIDOIO */
.corridor {
  display: flex;
  justify-content: space-between;
  height: 100vh;
  padding: 40px;
  box-sizing: border-box;
  background: linear-gradient(to bottom, #222, #000);
}

/* COLONNE */
.side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ARMADIETTI */
.locker {
  width: 120px;
  height: 180px;
  background: linear-gradient(#4da3ff, #1c4c7a);
  border-radius: 8px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0,0,0,0.7);
  transition: 0.2s;
}

.locker:hover {
  transform: scale(1.1);
}

/* MANIGLIA */
.handle {
  width: 10px;
  height: 40px;
  background: #ddd;
  position: absolute;
  right: 10px;
  top: 70px;
  border-radius: 3px;
}

/* LOOT */
.loot {
  position: fixed;
  color: yellow;
  font-size: 22px;
  font-weight: bold;
  pointer-events: none;
  animation: fade 1s forwards;
}
